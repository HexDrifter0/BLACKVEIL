name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - name: Report and enforce initial JavaScript bundle size
        run: npm run report:bundle
      - name: Validate local lab Compose configuration
        run: docker compose -f labs/docker-compose.yml config --quiet
